<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>משה: סיפורו של מנהיג</title>
</head>
<body style="margin:0; padding:40px 20px; background:#ffffff;">

<div dir="rtl" style="overflow-x: hidden; box-sizing: border-box; width: 100%; max-width: 860px; margin: 0 auto; color: #374151; line-height: 1.6;">

  <!-- קפסולת כותרת ראשית -->
  <div style="display: block; width: 100%; margin: 0 0 32px 0; box-sizing: border-box;">
    <div style="width: 100%; min-height: 52px; border-radius: 9999px; display: flex; align-items: center; justify-content: flex-start; padding: 10px 24px; box-sizing: border-box; background: linear-gradient(90deg, #6aa5b9 0%, #c3e5dd 25%, #cfeae4 50%, #ebf6f4 75%, #fefefe 100%);">
      <h1 style="display: block; width: 100%; text-align: right; font-weight: 800; color: #da4d39; margin: 0; font-size: 22px; line-height: 1.2;">
        משה: סיפורו של מנהיג
      </h1>
    </div>
  </div>

  <!-- מסגרת עוטפת -->
  <div style="border: 1px solid #bce1d9; border-radius: 20px; padding: 32px; box-sizing: border-box; width: 100%;">

    <!-- תיבת ציטוט -->
    <div style="background-color: #ebf6f4; border-radius: 16px; padding: 24px 32px; margin-bottom: 32px; box-sizing: border-box;">
        <p style="font-size: 18px; color: #1a4a5b; font-weight: bold; margin: 0; line-height: 1.9; text-align: right;">
            "וּמֹשֶׁה הָיָה רֹעֶה אֶת צֹאן יִתְרוֹ חֹתְנוֹ כֹּהֵן מִדְיָן" (שמות ג, א)
        </p>
    </div>

    <!-- פסקה רגילה -->
    <p style="margin: 0; text-align: right; font-size: 16px;">
        ברוכים הבאים לקורס <strong style="color: #da4d39;">משה: סיפורו של מנהיג</strong> — מסע לימודי בעקבות דמותו של משה רבנו, מנהיגותו, התמודדויותיו והמורשת שהותיר.
    </p>

  </div>

</div>

</body>
</html>
